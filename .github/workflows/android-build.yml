name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' | head -1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          echo "Using source ZIP: $ZIP"

          mkdir -p _source
          unzip -q "$ZIP" -d _source

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find "$GITHUB_WORKSPACE/_source" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ROOT")"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --version
          gradle tasks --stacktrace

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle test --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"

          sha256sum "$APK" | tee apk-sha256.txt

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" "$GITHUB_WORKSPACE/artifacts/"
          cp apk-sha256.txt "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRO-TRADER-AI-Android-Debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
